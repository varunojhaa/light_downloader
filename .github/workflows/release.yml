name: Build release executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rust-cli:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: light-downloader-windows-x64.exe
            binary: rust-core/target/release/light-downloader-rust.exe
          - name: Linux x64
            os: ubuntu-24.04
            artifact: light-downloader-linux-x64
            binary: rust-core/target/release/light-downloader-rust

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Build executable
        run: cargo build --release --manifest-path rust-core/Cargo.toml

      - name: Run tests
        run: cargo test --release --manifest-path rust-core/Cargo.toml

      - name: Rename executable
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  windows-gui:
    name: Windows GUI
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Win32 GUI and C worker
        shell: pwsh
        run: .\build-llvm.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows GUI installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc 'packaging\windows\light-downloader.iss'
          if ($LASTEXITCODE) { throw 'Inno Setup failed.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: light-downloader-windows-installer
          path: dist/Light-Downloader-*-setup.exe
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-cli, windows-gui]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: light-downloader-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Light Downloader ${GITHUB_REF_NAME}" \
            --generate-notes