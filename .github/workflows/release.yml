name: Build release executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  rust-cli:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: light-downloader-windows-x64.exe
            binary: rust-core/target/release/light-downloader-rust.exe
          - name: macOS x64
            os: macos-13
            artifact: light-downloader-macos-x64
            binary: rust-core/target/release/light-downloader-rust
          - name: Linux x64
            os: ubuntu-24.04
            artifact: light-downloader-linux-x64
            binary: rust-core/target/release/light-downloader-rust

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build executable
        run: cargo build --release --manifest-path rust-core/Cargo.toml

      - name: Run tests
        run: cargo test --release --manifest-path rust-core/Cargo.toml

      - name: Rename executable
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  windows-gui:
    name: Windows GUI
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Win32 GUI and C worker
        shell: pwsh
        run: .\build-llvm.ps1

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: light-downloader-windows-gui
          path: |
            build-llvm/LightDownloader.exe
            build-llvm/light-downloader.exe
          if-no-files-found: error