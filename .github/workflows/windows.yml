name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with LLVM
        shell: pwsh
        run: .\build-llvm.ps1
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: idm-c-windows
          path: build-llvm/*.exe
